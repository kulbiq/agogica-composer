# The Windows release build of the plug-in, on every vX.Y.Z tag and by hand. A tag attaches the
# zip (unsigned) to that tag's GitHub release; scripts/release-macos.sh adds the macOS zip there.
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  vst3:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # attaches the zip to the release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # JUCE
          fetch-depth: 0 # CMake takes the version from the tag
          persist-credentials: false # the build runs npm packages: no token left in .git/config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # JUCE links WebView2 statically on Windows and looks for the NuGet package.
      - run: nuget install Microsoft.Web.WebView2 -OutputDirectory "$env:USERPROFILE\AppData\Local\PackageManagement\NuGet\Packages"
      # The key of the usage-data project (public, write-only; empty in forks: nothing is ever sent).
      - if: vars.COMPOSER_TELEMETRY_KEY == ''
        run: echo "::warning::COMPOSER_TELEMETRY_KEY (a repository variable) is not set - this build never asks about usage data and never sends any."
      - run: cmake --preset release "-DCOMPOSER_TELEMETRY_KEY=${{ vars.COMPOSER_TELEMETRY_KEY }}"
      - run: cmake --build --preset release --target Composer_VST3 ComposerTests
      # The build that ships is tested too: the fast set and pluginval (strictness 10).
      - run: ctest --preset release -LE slow
      - shell: pwsh
        run: scripts/pluginval.ps1 build/release/Composer_artefacts/Release/VST3/Composer.vst3
      # Composer.vst3 at the zip root (copy it to %LOCALAPPDATA%\Programs\Common\VST3), with the
      # licence texts next to it, and the zip's SHA-256 beside it like the macOS one.
      - shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item -Recurse build/release/Composer_artefacts/Release/VST3/Composer.vst3 dist/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist/
          bash scripts/third-party-licences.sh dist/THIRD_PARTY_LICENSES.txt windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -a -c -f Composer-windows-x64.zip -C dist Composer.vst3 LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash Composer-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Composer-windows-x64.zip" | Out-File -Encoding ascii Composer-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: composer-windows-x64
          path: Composer-windows-x64.zip*
      # The macOS script may have made the release for this tag already.
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A tag with a suffix (v0.1.0-beta.1) is a pre-release: it never becomes "Latest".
            case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
            gh release create "$GITHUB_REF_NAME" --title "Composer ${GITHUB_REF_NAME#v}" --generate-notes $pre || {
              status=$?
              gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || exit "$status"
            }
          fi
          gh release upload --clobber "$GITHUB_REF_NAME" Composer-windows-x64.zip Composer-windows-x64.zip.sha256
