# The macOS release of the plug-in, on every vX.Y.Z tag (and by hand, on a tag): the zip and the
# installer, signed, notarized and attached to that tag's GitHub release by
# scripts/release-macos.sh. The Windows build attaches its zip to the same release.
#
# Secrets (the workflow fails at its first step without them):
#   MACOS_APPLICATION_P12, MACOS_INSTALLER_P12  the Developer ID Application and Developer ID
#                                               Installer certificates with their keys, base64
#   MACOS_P12_PASSWORD                          the password of both .p12 files
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER   the App Store Connect key that notarizes
name: macOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write # attaches the zip and the installer to the release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # JUCE
          fetch-depth: 0 # CMake takes the version from the tag
          persist-credentials: false # the build runs npm packages: no token left in .git/config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # the packages come from the cache: a build doesn't hang on the registry
          cache-dependency-path: "**/package-lock.json"
      # The certificates go into a keychain that exists for this run only.
      - name: Signing keys
        env:
          APPLICATION_P12: ${{ secrets.MACOS_APPLICATION_P12 }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          [ -n "$APPLICATION_P12" ] && [ -n "$INSTALLER_P12" ] && [ -n "$API_KEY_P8" ] || { echo "the signing secrets are not set" >&2; exit 1; }
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for p12 in "$APPLICATION_P12" "$INSTALLER_P12"; do
            echo "$p12" | base64 --decode > "$RUNNER_TEMP/identity.p12"
            security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
            rm "$RUNNER_TEMP/identity.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      # The key of the usage-data project (public, write-only). Not set: the build has no usage data at all.
      - run: cmake --preset release "-DCOMPOSER_TELEMETRY_KEY=${{ vars.COMPOSER_TELEMETRY_KEY }}" -DCOMPOSER_BUILD_TRACKER=OFF
      - run: cmake --build --preset release --parallel 4 --target Composer_VST3 Composer_AU ComposerTests
      # The build that ships is tested too: the fast set, auval and pluginval (strictness 10).
      - run: ctest --preset release -LE slow
      - run: scripts/pluginval.sh
      # The identities by their kind, not by name: each keychain of a run holds one of each.
      - run: scripts/release-macos.sh --skip-build --publish
        env:
          SIGN_IDENTITY: "Developer ID Application"
          INSTALLER_IDENTITY: "Developer ID Installer"
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          GH_TOKEN: ${{ github.token }}
      - if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
