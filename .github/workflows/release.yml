# Release on a version tag: build, test, sign, notarize, upload to R2, register on staging.
#   git tag v0.1.2 && git push origin v0.1.2
# Secrets (repo): MACOS_CERTIFICATE (base64 .p12 of "Developer ID Application"),
#   MACOS_CERTIFICATE_PASSWORD, APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_P8 (contents),
#   R2_UPLOAD_ACCESS_KEY_ID + R2_UPLOAD_SECRET_ACCESS_KEY (R2 Object Read & Write, agogica-releases only),
#   CLOUDFLARE_ACCOUNT_ID.
# Secrets (environment "staging"): SUPABASE_URL, SUPABASE_SECRET_KEY.
name: Release

on:
  push:
    tags: ["v[0-9]*"]
  # Dry run from the Actions tab: build, test, sign and notarize, but upload and register nothing.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    environment: staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # CMake reads the version from the vX.Y.Z tag

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ~125 MB of tracker models (tracker/models/fetch_models.py), downloaded once.
      - uses: actions/cache@v4
        with:
          path: tracker/models/*.onnx
          key: models-${{ hashFiles('tracker/models/fetch_models.py') }}

      - name: Build
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Signing keychain (temporary)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Apple's Developer ID G2 intermediate, so codesign can build the chain.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          mapfile -t KEYCHAINS < <(security list-keychains -d user | tr -d '"' | sed 's/^ *//')
          security list-keychains -d user -s "$KEYCHAIN" "${KEYCHAINS[@]}"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Sign, notarize, upload, register
        env:
          VERSION: ${{ github.ref_name }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          R2_UPLOAD_ACCESS_KEY_ID: ${{ secrets.R2_UPLOAD_ACCESS_KEY_ID }}
          R2_UPLOAD_SECRET_ACCESS_KEY: ${{ secrets.R2_UPLOAD_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export VERSION=${VERSION#v} R2_BUCKET=agogica-releases
          else
            export VERSION=0.0.0 SUPABASE_URL='' SUPABASE_SECRET_KEY='' # dry run
          fi
          scripts/release-macos.sh --skip-build

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
