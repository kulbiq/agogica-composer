# Pull request and branch checks: the fast test set (`ctest --preset debug -LE slow`; everything
# nightly) and pluginval, built the way a developer builds it, on macOS and on Windows. The
# Tracker is compiled and linked on both, without its models (it can't track here; its pure
# code is in the test set). The Windows job also uploads the Debug VST3 for trying on a Windows
# machine.
# No secrets, no signing: the macOS release is signed on a Mac (scripts/release-macos.sh).
name: Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly: the [slow] tests too (fuzz, silence skip)

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}-${{ github.event_name }} # a push never cancels the nightly run
  cancel-in-progress: true

jobs:
  # Memory and undefined behaviour (ASan + UBSan) on every run; data races (TSan) nightly, with
  # the [slow] cases. macOS only: the presets' flags are clang's.
  sanitizers:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ github.event_name == 'schedule' && fromJSON('["asan", "tsan"]') || fromJSON('["asan"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # JUCE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cmake --preset ${{ matrix.preset }} -DCOMPOSER_TRACKER_SKIP_MODELS=ON
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }} ${{ github.event_name == 'schedule' && ' ' || '-LE slow' }}

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # JUCE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: build/debug/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tracker/CMakeLists.txt') }}
      # JUCE links WebView2 statically on Windows and looks for the NuGet package.
      - if: runner.os == 'Windows'
        run: nuget install Microsoft.Web.WebView2 -OutputDirectory "$env:USERPROFILE\AppData\Local\PackageManagement\NuGet\Packages"
      - run: cmake --preset debug -DCOMPOSER_TRACKER_SKIP_MODELS=ON
      - run: cmake --build --preset debug --target ComposerTests
      # The page's own tests (the build above installed its packages and type-checked it).
      - run: npm test
        working-directory: ui
      - run: ctest --preset debug ${{ github.event_name == 'schedule' && ' ' || '-LE slow' }}
      # The Tracker has no other check on Windows: the owner builds on a Mac.
      - run: cmake --build --preset debug --target ComposerTracker
      # pluginval (strictness 10): loading, state, parameters, bus layouts, threading and the DSP.
      - if: runner.os == 'macOS'
        run: cmake --build --preset debug --target Composer_VST3 Composer_AU && scripts/pluginval.sh
      - if: runner.os == 'Windows'
        run: cmake --build --preset debug --target Composer_VST3
      - if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/pluginval.ps1 build/debug/Composer_artefacts/Debug/VST3/Composer.vst3
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: Composer-vst3-windows-debug
          path: build/debug/Composer_artefacts/Debug/VST3 # the folder, so the zip root is Composer.vst3
