# Every commit of a pull request must be signed off (CONTRIBUTING.md, "Sign your work"): a
# "Signed-off-by:" line naming the commit's author. No third-party app or action.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git show -s --format='%an <%ae>' "$commit")
            case "$author" in *"[bot] <"*) continue ;; esac # dependabot and other apps
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -Fxq "$author"; then
              echo "::error::$(git show -s --format='%h %s' "$commit") has no \"Signed-off-by: $author\" (git commit -s)"
              missing=1
            fi
          done
          exit $missing
